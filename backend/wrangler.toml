name = "ifiwasthere-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "hotinsert-db"
database_id = "34e0ca98-b64e-4c50-a66a-d8b61e784cb2"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "ifiwasthere-assets"

# Secrets (set via wrangler secret put):
#   AGNES_API_KEY          — Agnes AI API key
#   AUTH_SECRET            — JWT signing secret

[vars]
ENVIRONMENT = "development"
ADMIN_EMAILS = "zhengbijun123@gmail.com"

[dev]
port = 8787

[observability]
enabled = true

# Cleanup old generations every hour
[triggers]
crons = ["0 * * * *"]
