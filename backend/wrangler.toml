name = "ifiwasthere-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "hotinsert-db"
database_id = "34e0ca98-b64e-4c50-a66a-d8b61e784cb2"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "ifiwasthere-assets"

# Secrets (set via wrangler secret put):
#   AGNES_API_KEY       — Agnes AI API key
#   AUTH_SECRET         — JWT signing secret (shared with NextAuth)
#   R2_ACCESS_KEY_ID    — R2 API Token Access Key
#   R2_SECRET_ACCESS_KEY — R2 API Token Secret

[vars]
ENVIRONMENT = "development"
R2_ACCOUNT_ID = "50372a88bbcd6bb498358574ef749daf"
R2_BUCKET_NAME = "ifiwasthere-assets"
ADMIN_EMAILS = "zhengbijun123@gmail.com"

[dev]
port = 8787

[observability]
enabled = true

# Cleanup old generations every hour
[triggers]
crons = ["0 * * * *"]
