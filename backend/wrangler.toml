name = "hotinsert-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "hotinsert-db"
database_id = "34e0ca98-b64e-4c50-a66a-d8b61e784cb2"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "hotinsert-assets"

# Environment Variables (secrets)
# Set via: wrangler secret put FAL_API_KEY
# Set via: wrangler secret put AUTH_SECRET
[vars]
ENVIRONMENT = "development"
ADMIN_EMAILS = "zhengbijun123@gmail.com"

[dev]
port = 8787

[observability]
enabled = true
